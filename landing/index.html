<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="بیلدینو، تجربه‌ای یکپارچه و فارسی برای مشاهده وضعیت مالی، فعالیت‌ها و مدیریت زمینه ساختمان و واحد." />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4FAF9" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="بیلدینو | تجربه هوشمند زندگی در ساختمان" />
    <meta property="og:description" content="اطلاعات اقامت، وضعیت مالی و فعالیت‌ها؛ شفاف و یکپارچه در یک تجربه فارسی." />
    <meta property="og:type" content="website" />
    <title>بیلدینو | تجربه هوشمند زندگی در ساختمان</title>
    <script>
      (() => {
        const saved = localStorage.getItem('buildino-theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
